name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web, keeper, and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (keeper, scripts, tests)
        run: npm run typecheck
      - name: Typecheck (web)
        run: npx tsc --noEmit -p web
      - name: Lint
        run: npm --prefix web run lint
      - name: Keeper math matches the program
        run: npm run test:keeper-math
      - name: Backtest
        run: npm run test:backtest
      - name: Production build
        run: npm run build:web

  program:
    name: Order program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Rust unit tests
        run: cargo test -p holdfill_orders --lib
